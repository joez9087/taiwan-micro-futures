name: Taiwan Micro Futures Hourly Cloud Alert

on:
  schedule:
    # Runs every hour 24/7 Monday to Friday (covers full day & night sessions)
    - cron: '0 * * * 1-5'
    # Additional pre-market alert at 08:30 Taiwan Time (00:30 UTC)
    - cron: '30 0 * * 1-5'
  workflow_dispatch: # Allows manual trigger anytime from GitHub Web UI

jobs:
  run-hourly-alert:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install yfinance pandas numpy requests

    - name: Execute Hourly Quant Alert Dispatcher
      env:
        BARK_KEY: ${{ secrets.BARK_KEY || '55QijEor5EwHqVqd6Cg9jJ' }}
      run: |
        python scripts/cloud_hourly_alert.py
